{% extends 'base.html' %}

{% block title %}Iniciar Sesión | Sistema Biblioteca{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom p-4 shadow">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-book-reader fa-3x text-primary mb-2"></i>
                    <h3 class="fw-bold text-dark">Acceso al Sistema</h3>
                    <p class="text-muted small">Gestión de Biblioteca Pública</p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label text-secondary fw-semibold">Nombre de Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                            <input type="text" name="username" id="username" class="form-control" placeholder="Ingresa tu usuario" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label text-secondary fw-semibold">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Iniciar Sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
